<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="finchglowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00AEEF" />
      <stop offset="100%" stop-color="#00395C" />
    </linearGradient>
    <linearGradient id="wingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E6F7FD" />
    </linearGradient>
  </defs>

  <!-- Rounded Brand Base -->
  <rect width="64" height="64" rx="16" fill="url(#finchglowGrad)" />

  <!-- Stylized Finchglow "F" Emblem with Flight/Wing Curve -->
  <g fill="url(#wingGrad)">
    <!-- Vertical Spine -->
    <rect x="18" y="16" width="7" height="32" rx="3.5" />
    <!-- Top Horizontal Bar with dynamic curve -->
    <path d="M22 16 H44 C46.2 16 47 17.5 45.8 19.2 L43 23 H22 Z" />
    <!-- Middle Bar with forward flight angle -->
    <path d="M22 28 H38 C39.8 28 40.5 29.2 39.5 30.6 L37.2 34 H22 Z" />
  </g>
</svg>